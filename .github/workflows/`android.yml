name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config cmake libffi-dev libssl-dev zlib1g-dev
          python -m pip install buildozer 'Cython<3'
      - name: Test draw engine
        run: python -m unittest discover -p test_store.py -v
      - name: Build APK
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: hanaro-android-apk
          path: bin/*.apk
          if-no-files-found: error
